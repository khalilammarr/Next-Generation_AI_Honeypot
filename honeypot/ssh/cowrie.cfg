# ============================================================================
# cowrie.cfg - Senior SOC Honeypot Configuration
# Optimized for high-fidelity deception and SIEM Integration
# ============================================================================

[honeypot]
# Make it look like a real production Ubuntu server
sensor_name = prod-server-01
hostname = srv-prod-01

# Logging Paths
log_path = var/log/cowrie
ttylog = true
ttylog_path = ${honeypot:state_path}/tty
logtype = rotating
timezone = UTC

# Malware / Dropper capture
download_path = ${honeypot:state_path}/downloads
download_limit_size = 10485760

# --- CRITICAL SOC FIX ---
# We MUST use "pool" (the standard fake filesystem) for the official Cowrie image
# If you want to use the LLM backend directly in Cowrie, you must use a custom fork!
backend = pool

# Idle/auth timeouts (Keep them hooked, but drop dead connections)
idle_timeout = 180
authentication_timeout = 120

# ============================================================================
# Authentication Layer (The Hook)
# ============================================================================
[honeypot]
# AuthRandom: Allows attackers in after a random number of failed attempts
# This tricks them into thinking they successfully cracked the password!
auth_class = AuthRandom
auth_class_parameters = 2, 5, 10

# ============================================================================
# Shell Emulation (Ubuntu 22.04 LTS Disguise)
# ============================================================================
[shell]
filesystem = ${honeypot:data_path}/fs.pickle
processes = ${honeypot:data_path}/cmdoutput.json

# Disguise the kernel exactly like a modern Ubuntu 22.04 server
arch = linux-x64-lsb
kernel_version = 5.15.0-76-generic
kernel_build_string = #83-Ubuntu SMP Thu Jun 15 19:16:32 UTC 2023
hardware_platform = x86_64
operating_system = GNU/Linux
ssh_version = OpenSSH_8.9p1, OpenSSL 3.0.2 15 Mar 2022

# ============================================================================
# SSH Service Settings
# ============================================================================
[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0

# Disguise the SSH banner to match Ubuntu perfectly
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6

sftp_enabled = true
forwarding = true
auth_publickey_allow_any = false
auth_keyboard_interactive_enabled = false

ciphers = aes128-ctr,aes192-ctr,aes256-ctr,aes256-cbc,aes192-cbc,aes128-cbc,3des-cbc
macs = hmac-sha2-512,hmac-sha2-256,hmac-sha1,hmac-md5
compression = zlib@openssh.com,zlib,none

# ============================================================================
# Telnet (Disabled to focus purely on modern SSH attacks)
# ============================================================================
[telnet]
enabled = false

# ============================================================================
# Output: JSON log (Critical for Wazuh SIEM Integration)
# ============================================================================
[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false

# ============================================================================
# Output: MongoDB (Disabled - Avoids Container Crashes)
# ============================================================================
[output_mongodb]
# We do not have a MongoDB container, so this MUST be false!
enabled = false

# ============================================================================
# Deception AI (For experimental Cowrie LLM Forks only)
# ============================================================================
# NOTE: The official Cowrie image will ignore this section unless you install
# the specific LLM Python plugin inside it. 
[llm]
host = http://ollama-server
path = /v1/chat/completions
api_key = ollama
model = llama3
max_tokens = 500
temperature = 0.7
debug = false
