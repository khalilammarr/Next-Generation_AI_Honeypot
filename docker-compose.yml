services:
  # SSH Honeypot (Cowrie)
  ssh-honeypot:
    image: cowrie/cowrie:latest
    container_name: cowrie-ssh
    ports:
      - "22:2222"
    volumes:
      - cowrie-var:/cowrie/cowrie-git/var
      - /var/log/cowrie:/cowrie/cowrie-git/var/log/cowrie
    restart: always

  # Shared Intelligence (MQTT Broker)
  gossip-bus:
    image: eclipse-mosquitto:latest
    container_name: honey-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./configs/mqtt:/mosquitto/config
    restart: always

  # LLM Engine (Local)
  llm-engine:
    image: ollama/ollama:latest
    container_name: ollama-server
    volumes:
      - ./ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: always

  # HTTP Honeypot (FastAPI Agent)
  http-honeypot:
    build: ./honeypot/http
    container_name: honey-http
    ports:
      - "80:8000"
    volumes:
      - ./logs/http:/app/logs
    restart: always

  # Real-time Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: honey-dashboard
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: always

volumes:
  cowrie-var:
